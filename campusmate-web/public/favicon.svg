<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Royal Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Academic Graduation Cap Symbol -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond (Top) -->
    <polygon points="32,15 54,25.5 32,36 10,25.5" fill="#ffffff"/>
    
    <!-- Skull Base -->
    <path d="M19,29.5 L19,39 C19,45 45,45 45,39 L45,29.5" fill="#e0e7ff"/>
    
    <!-- Golden Tassel -->
    <path d="M32,25.5 Q46,27 48,37" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="38" r="2.8" fill="url(#gold)"/>
  </g>

  <!-- Mini Sparkle -->
  <path d="M14,14 L15.5,10.5 L19,9 L15.5,7.5 L14,4 L12.5,7.5 L9,9 L12.5,10.5 Z" fill="#fde047" opacity="0.9"/>
</svg>
